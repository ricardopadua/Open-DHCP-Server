[package]
name = "open-dhcp"
version = "1.2.2"
edition = "2021"
description = "Open DHCP - painel do servidor DHCP numa janela própria"
license = "GPL-2.0-only"

[[bin]]
name = "open-dhcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
opendhcp-panel = { path = ".." }
png = "0.18.1"
serde_json = "1.0.154"
sys-locale = "0.3.2"
tao = "0.38.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time"] }
toml = "1.2.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
wry = "0.58.2"

[build-dependencies]
embed-manifest = "1.5.1"

# AppImage (cargo bundle --format appimage): só o aplicativo.
[package.metadata.bundle]
name = "Open DHCP"
identifier = "io.github.ricardopadua.opendhcp"
icon = ["assets/icon.png"]
category = "public.app-category.utilities"
short_description = "Open DHCP - painel do servidor DHCP"
long_description = "Painel do Open DHCP Server numa janela própria: monitoramento em tempo real, reservas, faixas, opções e backups."
